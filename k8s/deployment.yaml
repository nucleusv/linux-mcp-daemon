apiVersion: apps/v1
kind: Deployment
metadata:
  name: linux-mcp-daemon
  namespace: linux-mcp-daemon-by-claude
  labels:
    app: linux-mcp-daemon
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: linux-mcp-daemon
  template:
    metadata:
      labels:
        app: linux-mcp-daemon
    spec:
      # Use host network and PID namespaces to allow introspecting the host VM
      hostNetwork: true
      hostPID: true
      containers:
      - name: daemon
        image: linux-mcp-daemon-by-claude:local
        imagePullPolicy: IfNotPresent # Allows K8s to pull dynamic local image tags
        securityContext:
          privileged: true # Required to perform root-level operations via mcp-sudo
        ports:
        - containerPort: 9091
          name: http
        volumeMounts:
        # A single mount of the host's real root covers /proc and /sys too
        # (as /host/proc, /host/sys) - no Go code ever referenced the old
        # dedicated host-proc/host-sys mounts directly (the daemon reads
        # plain /proc, /sys, relying on hostPID/hostNetwork namespace
        # sharing instead), so keeping them separately was dead config.
        - name: host-root
          mountPath: /host
          readOnly: true
          # Without this, mounts created on the host after the pod starts (e.g.
          # containerd's per-container overlayfs snapshots) show up as empty
          # directories under /host - HostToContainer propagates them in.
          mountPropagation: HostToContainer
      volumes:
      - name: host-root
        hostPath:
          path: /
