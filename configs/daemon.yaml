server:
  port: 9090
  tls:
    enabled: false
    port: 9443
    cert_file: "/etc/ssl/certs/mcpd.crt"
    key_file: "/etc/ssl/private/mcpd.key"
rate_limits:
  default_rps: 50.0
  default_burst: 100

worker:
  timeout_seconds: 30

tools:
  get_disk_usage:
    timeout_seconds: 300

users:
  - username: "testuser"
    token: "my-test-token-123"
  - username: "unpriviliged"
    token: "my-unprivileged-token-123"