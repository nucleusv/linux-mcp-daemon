server:
  port: 9091
  tls:
    enabled: false
    port: 9443
    cert_file: "/etc/ssl/certs/mcpd.crt"
    key_file: "/etc/ssl/private/mcpd.key"
rate_limits:
  default_rps: 50.0
  default_burst: 100
worker:
  timeout_seconds: 30
  # This daemon runs inside a Kubernetes pod with its own private rootfs
  # (see k8s/deployment.yaml) - true here means every privileged worker call
  # also joins the real host's mount namespace, so "privileged: true" means
  # root on the actual host, not just root inside this container's image.
  containerized: true
logging:
  # error | warn | info | debug. info: one line per tool call; debug adds
  # every JSON-RPC request and SSE session. Calls that change the host are
  # audit-logged at any level.
  level: info
  format: text       # text | json (for journald/Loki/ELK field extraction)
  access_log: true   # one line per HTTP request, at any level
tools:
  disks/usage:
    timeout_seconds: 300
