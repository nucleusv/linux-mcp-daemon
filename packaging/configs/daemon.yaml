# mcpd daemon configuration - installed by scripts/install.sh to
# /etc/mcpd/configs/daemon.yaml. Existing files are never overwritten on
# upgrade.
server:
  # HTTPS on 9091, on all interfaces. Bearer tokens travel in every request,
  # so they must not cross a network in clear text.
  tls:
    enabled: true
    port: 9091
    # Relative paths are in this directory. With generate: true, mcpd creates
    # a self-signed certificate here on its first start if neither file
    # exists (to replace it, delete both and restart), and logs its SHA-256
    # fingerprint - clients pin it (MCP_TLS_FINGERPRINT) or trust the file
    # (MCP_CA_CERT). Put a CA-issued certificate's files here instead to use
    # that one.
    cert_file: tls/mcpd.crt
    key_file: tls/mcpd.key
    generate: true
    # Extra names/addresses for a generated certificate (it already covers
    # the host name, localhost and every address of this machine):
    # hosts: [mcp.example.com]
  # Plain HTTP - tokens in clear text. Only for a trusted network, or behind
  # a proxy that terminates TLS.
  http:
    enabled: false
    port: 9090
rate_limits:
  default_rps: 50.0
  default_burst: 100
worker:
  timeout_seconds: 30
  # false: mcpd runs directly on the host it administers (the systemd
  # install). Set true only when mcpd runs inside a container and should
  # administer the real host.
  containerized: false
logging:
  # error | warn | info | debug. info: one line per tool call; debug adds
  # every JSON-RPC request and SSE session. Calls that change the host are
  # audit-logged at any level.
  level: info
  format: text       # text | json (for journald/Loki/ELK field extraction)
  access_log: true   # one line per HTTP request, at any level
tools:
  disks/usage:
    timeout_seconds: 300
# Users and their tokens live in users.yaml; root grants in mcp-sudo.yaml.
