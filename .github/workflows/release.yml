# Release pipeline: pushing a SemVer tag (v0.1.0, v1.2.3, v1.0.0-rc.1)
# tests the code, then publishes
#   - a GitHub Release: per-platform archives (mcpd + linuxctl for Linux
#     amd64/arm64, linuxctl for macOS amd64/arm64), checksums.txt and a
#     changelog - built by GoReleaser from .goreleaser.yaml;
#   - a multi-arch container image: ghcr.io/nucleusv/linux-mcp-daemon.
#
# To release:  git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]

permissions:
  contents: read

# Runners are pinned to a fixed Ubuntu release (the one our test VPS runs)
# rather than ubuntu-latest, which moves to a new major without notice.
# Actions are on their Node 24 majors - Node 20 actions are deprecated.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - name: Docs cover every tool
        run: bash scripts/check_readmes.sh && bash scripts/check_docs.sh

  binaries:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history: GoReleaser builds the changelog from it
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/linux-mcp-daemon
          # v1.2.3 -> 1.2.3, 1.2 and latest; a pre-release (v1.0.0-rc.1)
          # gets only its own tag, never latest.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          flavor: |
            latest=auto
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.meta.outputs.version }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            CONFIG_DIR=packaging/configs-container
          cache-from: type=gha
          cache-to: type=gha,mode=max
