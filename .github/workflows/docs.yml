# Builds the documentation site (Docusaurus, docs/website) and publishes it
# to the gh-pages branch, which GitHub Pages serves at
# https://nucleusv.github.io/linux-mcp-daemon/ - on every push to main that
# changes the docs, so the site never lags behind the code.
name: docs

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write # push to gh-pages

concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/website/package-lock.json

      - name: Build
        working-directory: docs/website
        run: |
          npm ci
          npm run build

      # Same result as `docusaurus deploy`: the build replaces the branch's
      # contents in a new commit on top of its history.
      - name: Publish to gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --depth 1 --branch gh-pages \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" site
          find site -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a docs/website/build/. site/
          touch site/.nojekyll
          cd site
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Site unchanged."
            exit 0
          fi
          git commit -m "Deploy website - based on ${GITHUB_SHA}"
          git push origin gh-pages
